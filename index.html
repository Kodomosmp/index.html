<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multi Fractal Viewer</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#0b0b10;color:#e8e8ee;font:13px system-ui,"Noto Sans Thai",sans-serif}
  #app{display:flex;height:100%}
  #panel{width:300px;min-width:300px;overflow-y:auto;padding:10px;background:#15151c;border-right:1px solid #2a2a35}
  #stage{flex:1;position:relative;min-width:0}
  canvas{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
  button{background:#2b2b3a;color:#fff;border:1px solid #444;border-radius:6px;padding:6px 10px;cursor:pointer;font:inherit}
  button:hover{background:#3a3a50}
  .row{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
  .card{border:1px solid #2f2f3d;border-radius:8px;padding:8px;margin-bottom:8px;background:#1b1b25}
  .card h4{margin:0 0 6px;display:flex;justify-content:space-between;align-items:center;font-size:13px}
  .card h4 span button{padding:2px 6px;margin-left:4px}
  label{display:grid;grid-template-columns:78px 1fr 40px;align-items:center;gap:6px;margin:3px 0}
  label b{font-weight:400;text-align:right;color:#9aa}
  input[type=range]{width:100%}
  #toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#2e7d32;color:#fff;padding:8px 14px;border-radius:8px;opacity:0;transition:.3s;pointer-events:none}
  #toast.on{opacity:1}
  small{color:#889}
  @media(max-width:700px){#app{flex-direction:column-reverse}#panel{width:100%;min-width:0;height:42%}}
</style>
</head>
<body>
<div id="app">
  <div id="panel">
    <div class="row">
      <button id="add">+ เพิ่มอัน</button>
      <button id="share">คัดลอกลิงก์</button>
      <button id="reset">รีเซ็ต</button>
    </div>
    <label><span>คุณภาพ</span><input id="q" type="range" min="0.25" max="1" step="0.05" value="0.55"><b id="qv">0.55</b></label>
    <small>ลากเมาส์บนภาพเพื่อหมุนอันนั้น / เลื่อนล้อเพื่อซูม · คุณภาพสูง = แลคหนัก</small>
    <div id="list" style="margin-top:8px"></div>
  </div>
  <div id="stage"><canvas id="c"></canvas></div>
</div>
<div id="toast">คัดลอกลิงก์แล้ว</div>

<script>
const SCHEMA=[
  ['pow','เลขชี้กำลัง',2,16,0.1],
  ['iter','จำนวนรอบ',4,28,1],
  ['hue','สีหลัก',0,1,0.01],
  ['spread','ช่วงสี',0,2,0.01],
  ['spin','หมุนเอง',-1,1,0.01],
  ['dist','ระยะกล้อง',1.3,6,0.05],
  ['steps','ความละเอียด',60,260,5]
];
const DEF={pow:8,iter:12,hue:.6,spread:.9,spin:.25,dist:2.6,steps:140,yaw:.6,pitch:.3};
const PRESETS=[{iter:12,steps:140},{pow:5,hue:.08,spread:1.2,iter:14,steps:150},{pow:12,hue:.35,spread:.6,iter:10,steps:130},{pow:3,hue:.85,spread:1.5,iter:16,steps:160}];
let items=[],quality=0.55;

function mk(o){return Object.assign({},DEF,o||{})}
function initItems(){items=[mk(PRESETS[0]),mk(PRESETS[1])]}
function encode(){return btoa(unescape(encodeURIComponent(JSON.stringify({q:quality,i:items.map(it=>{const r={};for(const k in it)r[k]=+(+it[k]).toFixed(3);return r})}))))}
function decode(s){const d=JSON.parse(decodeURIComponent(escape(atob(s))));quality=d.q||0.6;items=d.i.map(mk)}

const shareParam = new URLSearchParams(location.search).get('c');
if (shareParam) {
  try {
    decode(shareParam);
    document.getElementById('panel').style.display = 'none';
  } catch(e) {
    initItems();
  }
} else {
  initItems();
}

// ---------- UI ----------
const list=document.getElementById('list');
function build(){
  list.innerHTML='';
  items.forEach((it,idx)=>{
    const card=document.createElement('div');card.className='card';
    card.innerHTML=`<h4>อันที่ ${idx+1}<span><button data-a="dup">ก็อป</button><button data-a="del">ลบ</button></span></h4>`;
    SCHEMA.forEach(([k,name,mn,mx,st])=>{
      const l=document.createElement('label');
      l.innerHTML=`<span>${name}</span><input type="range" min="${mn}" max="${mx}" step="${st}" value="${it[k]}"><b>${it[k]}</b>`;
      const inp=l.querySelector('input'),v=l.querySelector('b');
      inp.oninput=()=>{it[k]=+inp.value;v.textContent=inp.value};
      card.appendChild(l);
    });
    card.querySelector('[data-a=dup]').onclick=()=>{items.splice(idx+1,0,mk(it));build()};
    card.querySelector('[data-a=del]').onclick=()=>{if(items.length>1){items.splice(idx,1);build()}};
    list.appendChild(card);
  });
}
document.getElementById('add').onclick=()=>{if(items.length<12){items.push(mk(PRESETS[items.length%PRESETS.length]));build()}};
document.getElementById('reset').onclick=()=>{initItems();build()};
const qEl=document.getElementById('q'),qv=document.getElementById('qv');
qEl.value=quality;qv.textContent=quality;
qEl.oninput=()=>{quality=+qEl.value;qv.textContent=quality;resize()};
document.getElementById('share').onclick=async()=>{
  const url=location.href.split('#')[0].split('?')[0]+'?c='+encodeURIComponent(encode());
  try{await navigator.clipboard.writeText(url)}catch(e){prompt('คัดลอกลิงก์นี้',url)}
  const t=document.getElementById('toast');t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1500);
};
build();

// ---------- GL ----------
const cv=document.getElementById('c');
const gl=cv.getContext('webgl',{antialias:false,preserveDrawingBuffer:false});
const VS='attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}';
const FS=`precision highp float;
uniform vec2 uOrg,uRes;uniform float uPow,uIter,uHue,uSpread,uYaw,uPitch,uDist,uSteps;

// Heavy kernel inspired by the classic style you provided (more iterations + derivative)
float kernal(vec3 ver, out float trap){
  vec3 a = ver;
  float b, c, d, dr = 1.0;
  trap = 1e9;
  for(int i = 0; i < 32; i++){          // raised hard limit so it actually costs
    if(float(i) >= uIter) break;
    b = length(a);
    if(b > 4.0) break;
    trap = min(trap, b);
    // classic spherical power (same math as your kernel)
    c = atan(a.y, a.x) * uPow;
    d = acos(clamp(a.z / b, -1.0, 1.0)) * uPow;
    float rpow = pow(b, uPow - 1.0);
    dr = rpow * uPow * dr + 1.0;         // keep derivative for proper DE
    b = pow(b, uPow);
    a = vec3(b * sin(d) * cos(c),
             b * sin(d) * sin(c),
             b * cos(d)) + ver;
  }
  // return approximate distance + trap for coloring
  return 0.5 * log(b) * b / dr;
}

// even heavier version of the kernel you posted (pure potential, used for extra work)
float kernalHeavy(vec3 ver){
  vec3 a = ver;
  float b, c, d, e;
  for(int i = 0; i < 12; i++){           // more loops than the original 5
    b = length(a);
    c = atan(a.y, a.x) * 8.0;
    e = 1.0 / max(b, 1e-6);
    d = acos(clamp(a.z / b, -1.0, 1.0)) * 8.0;
    b = pow(b, 8.0);
    a = vec3(b * sin(d) * cos(c),
             b * sin(d) * sin(c),
             b * cos(d)) + ver;
    if(b > 6.0) break;
  }
  return 4.0 - dot(a, a);
}

vec2 de(vec3 p){
  float trap;
  float d = kernal(p, trap);
  // force some extra expensive work every sample so it lags like the real heavy shaders
  float dummy = kernalHeavy(p * 1.01) + kernalHeavy(p * 0.99);
  d += dummy * 1e-9;                     // keep the compiler from optimizing it away
  return vec2(d, trap);
}

vec3 hsv(float h, float s, float v){
  vec3 k = clamp(abs(mod(h * 6. + vec3(0., 4., 2.), 6.) - 3.) - 1., 0., 1.);
  return v * mix(vec3(1.), k, s);
}

void main(){
  vec2 uv = (gl_FragCoord.xy - uOrg - .5 * uRes) / uRes.y * 2.;
  vec3 ro = uDist * vec3(cos(uPitch) * sin(uYaw), sin(uPitch), cos(uPitch) * cos(uYaw));
  vec3 f = normalize(-ro), rt = normalize(cross(f, vec3(0., 1., 0.))), up = cross(rt, f);
  vec3 rd = normalize(f * 1.7 + uv.x * rt + uv.y * up);

  float t = 0., trap = 0.;
  bool hit = false;
  float n = 0.;

  // raised raymarch limit so quality slider actually hurts
  for(int i = 0; i < 280; i++){
    if(float(i) >= uSteps) break;
    vec2 d = de(ro + rd * t);
    trap = d.y;
    n = float(i);
    if(d.x < 0.0005 * t){ hit = true; break; }
    t += d.x * 0.85;                     // slightly conservative step = more samples
    if(t > 10.) break;
  }

  vec3 col = vec3(0.04, 0.04, 0.07) * (1. - length(uv) * .4);

  if(hit){
    vec3 p = ro + rd * t;
    // expensive 6-tap normal (instead of cheap 3-tap) + extra kernel calls
    vec2 e = vec2(0.0008 * t, 0.);
    float d0 = de(p).x;
    vec3 nor = normalize(vec3(
      de(p + e.xyy).x - de(p - e.xyy).x,
      de(p + e.yxy).x - de(p - e.yxy).x,
      de(p + e.yyx).x - de(p - e.yyx).x
    ));
    // soft-ish lighting with a second light + fake occlusion
    vec3 l1 = normalize(vec3(.6, .8, .5));
    vec3 l2 = normalize(vec3(-.4, .3, .7));
    float dif1 = clamp(dot(nor, l1), 0., 1.);
    float dif2 = clamp(dot(nor, l2), 0., 1.) * 0.45;
    float ao = 1. - n / uSteps;
    // a little extra work for specular-ish highlight
    float spec = pow(clamp(dot(reflect(-l1, nor), -rd), 0., 1.), 32.) * 0.35;

    vec3 base = hsv(uHue + trap * uSpread, .78, 1.);
    col = base * (.18 + .85 * dif1 + dif2) * (.25 + .85 * ao) + base * spec;
  }

  gl_FragColor = vec4(pow(col, vec3(.88)), 1.);
}`;
function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))console.error(gl.getShaderInfoLog(o));return o}
const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,VS));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,FS));gl.linkProgram(pr);gl.useProgram(pr);
const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
const loc=gl.getAttribLocation(pr,'a');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
const U={};['uOrg','uRes','uPow','uIter','uHue','uSpread','uYaw','uPitch','uDist','uSteps'].forEach(n=>U[n]=gl.getUniformLocation(pr,n));

let W=1,H=1;
function resize(){W=Math.max(1,Math.floor(cv.clientWidth*quality));H=Math.max(1,Math.floor(cv.clientHeight*quality));cv.width=W;cv.height=H}
addEventListener('resize',resize);resize();

function layout(){const n=items.length,cols=Math.ceil(Math.sqrt(n*W/H)),c=Math.min(n,Math.max(1,cols)),r=Math.ceil(n/c);return{c,r}}
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  const {c,r}=layout(),cw=Math.floor(W/c),ch=Math.floor(H/r);
  gl.viewport(0,0,W,H);gl.clearColor(.04,.04,.06,1);gl.clear(gl.COLOR_BUFFER_BIT);
  items.forEach((it,i)=>{
    if(!drag||drag.i!==i)it.yaw+=it.spin*dt;
    const x=(i%c)*cw,y=H-(Math.floor(i/c)+1)*ch;
    gl.viewport(x,y,cw-1,ch-1);
    gl.uniform2f(U.uOrg,x,y);gl.uniform2f(U.uRes,cw-1,ch-1);
    gl.uniform1f(U.uPow,it.pow);gl.uniform1f(U.uIter,it.iter);gl.uniform1f(U.uHue,it.hue);
    gl.uniform1f(U.uSpread,it.spread);gl.uniform1f(U.uYaw,it.yaw);gl.uniform1f(U.uPitch,it.pitch);
    gl.uniform1f(U.uDist,it.dist);gl.uniform1f(U.uSteps,it.steps);
    gl.drawArrays(gl.TRIANGLES,0,3);
  });
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---------- mouse / touch ----------
let drag=null;
function cellAt(e){
  const b=cv.getBoundingClientRect(),{c,r}=layout();
  const cx=Math.min(c-1,Math.floor((e.clientX-b.left)/b.width*c)),cy=Math.min(r-1,Math.floor((e.clientY-b.top)/b.height*r));
  return Math.min(items.length-1,cy*c+cx);
}
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);drag={i:cellAt(e),x:e.clientX,y:e.clientY};cv.style.cursor='grabbing'});
cv.addEventListener('pointermove',e=>{
  if(!drag)return;const it=items[drag.i];
  it.yaw-=(e.clientX-drag.x)*0.008;it.pitch=Math.max(-1.5,Math.min(1.5,it.pitch+(e.clientY-drag.y)*0.008));
  drag.x=e.clientX;drag.y=e.clientY;
});
cv.addEventListener('pointerup',()=>{drag=null;cv.style.cursor='grab'});
cv.addEventListener('wheel',e=>{e.preventDefault();const it=items[cellAt(e)];it.dist=Math.max(1.3,Math.min(6,it.dist*(1+Math.sign(e.deltaY)*0.06)));build()},{passive:false});
</script>
</body>
</html>
